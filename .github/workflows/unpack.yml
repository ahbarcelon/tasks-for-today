name: Import application source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract application source
        shell: bash
        run: |
          unzip -o tasks-for-today.zip
          rm -f tasks-for-today.zip .github/workflows/unpack.yml
      - name: Commit imported files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import application source"
          git push
